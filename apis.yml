aid: ask-sage
name: Ask Sage
description: >-
  Ask Sage is a secure, government- and defense-grade generative AI platform that
  gives regulated organizations access to a broad catalog of commercial and open
  large language models behind a strict compliance boundary (FedRAMP High, DoD
  Impact Level 5/6, CMMC, NIST 800-53, GDPR). Beyond chat, it offers retrieval over
  private datasets, agents and an Agent Builder, plugins, a Deep Agent, and Model
  Context Protocol (MCP) integrations for Microsoft 365, GitHub, and Box. The
  platform is exposed through two REST APIs — a Server API for core AI operations
  (models, completions, agents, datasets, training) and a User API for
  authentication, API keys, and dataset management — plus OpenAI-, Anthropic-, and
  Gemini-style compatibility endpoints and an official Python client.
