idempotency:
  supported: false
  note: No Idempotency-Key header or idempotent-retry contract is documented.
pagination:
  style: parameter-limited
  note: >-
    No cursor/offset envelope. A handful of list endpoints accept a limit
    (e.g. User API get-user-logins defaults to the last 5 logins). Most list
    endpoints return full collections.
versioning:
