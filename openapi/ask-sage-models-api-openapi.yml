openapi: 3.2.0
info:
  title: Ask Sage Server Models API
  description: Ask Sage is an AI-powered platform providing intelligent completions, knowledge management, and workflow automation.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/server'
  description: Ask Sage Server API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: Models
  description: AI model management
paths:
  /get-models:
    get:
      summary: Get available models
      description: Returns a list of all available AI models
      security: []
      tags:
      - Models
      responses:
        '200':
          description: List of available models
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: array
                    items:
                      type: string
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        object:
                          type: string
                          example: model
                        created:
                          type: string
                        name:
                          type: string
                        owned_by:
                          type: string
                  status:
                    type: integer
                    example: 200
      operationId: getGetModels
      x-operation-id-source: derived
    post:
      summary: Get available models
      description: Returns a list of all available AI models
      security: []
      tags:
      - Models
      responses:
        '200':
          description: List of available models
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: array
                    items:
                      type: string
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        object:
                          type: string
                          example: model
                        created:
                          type: string
                        name:
                          type: string
                        owned_by:
                          type: string
                  status:
                    type: integer
                    example: 200
      operationId: postGetModels
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling the User API endpoint `/user/get-token-with-api-key` with your email and API key.
