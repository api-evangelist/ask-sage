openapi: 3.2.0
info:
  title: Ask Sage User Allocation API
  description: Ask Sage User API for account management, organization administration, billing, and platform configuration.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/user'
  description: Ask Sage User API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: Allocation
  description: Token allocation and distribution policies
paths:
  /admin-allocation-policy-get:
    post:
      summary: Get allocation policy (admin)
      tags:
      - Allocation
      responses:
        '200':
          description: Policy retrieved
      operationId: postAdminAllocationPolicyGet
      x-operation-id-source: derived
  /admin-allocation-policy-update:
    post:
      summary: Update allocation policy (admin)
      tags:
      - Allocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                strategy:
                  type: string
                percentage:
                  type: number
                fixed_amount:
                  type: integer
                min_allocation:
                  type: integer
                max_allocation:
                  type: integer
      responses:
        '200':
          description: Policy updated
      operationId: postAdminAllocationPolicyUpdate
      x-operation-id-source: derived
  /admin-token-distribution-preview:
    post:
      summary: Preview token distribution (admin)
      tags:
      - Allocation
      responses:
        '200':
          description: Distribution preview
      operationId: postAdminTokenDistributionPreview
      x-operation-id-source: derived
  /admin-token-distribution-execute:
    post:
      summary: Execute token distribution (admin)
      tags:
      - Allocation
      responses:
        '200':
          description: Distribution executed
      operationId: postAdminTokenDistributionExecute
      x-operation-id-source: derived
  /admin-allocation-dashboard:
    post:
      summary: Get allocation dashboard (admin)
      tags:
      - Allocation
      responses:
        '200':
          description: Dashboard data retrieved
      operationId: postAdminAllocationDashboard
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling `/get-token-with-api-key` with your email and 64-character API key. Some admin and superadmin endpoints also require an email address in the request body to identify the target user.
