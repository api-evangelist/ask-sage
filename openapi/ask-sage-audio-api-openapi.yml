openapi: 3.2.0
info:
  title: Ask Sage Server Audio API
  description: Ask Sage is an AI-powered platform providing intelligent completions, knowledge management, and workflow automation.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/server'
  description: Ask Sage Server API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: Audio
  description: Audio processing (TTS/STT)
paths:
  /get-text-to-speech:
    post:
      summary: Convert text to speech
      description: Generate audio from text using text-to-speech
      tags:
      - Audio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  description: Text to convert to speech
                voice:
                  type: string
                  default: alloy
                  description: Voice to use for speech
                model:
                  type: string
                  default: tts-hd
                  description: TTS model to use
                provider:
                  type: string
                  description: TTS provider to use (e.g., 'google' for Gemini, default is Azure/OpenAI)
                language_code:
                  type: string
                  default: en-US
                  description: Language code for speech synthesis (used with Google provider)
      responses:
        '200':
          description: Audio file
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
      operationId: postGetTextToSpeech
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling the User API endpoint `/user/get-token-with-api-key` with your email and API key.
