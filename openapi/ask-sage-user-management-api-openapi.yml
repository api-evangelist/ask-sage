openapi: 3.2.0
info:
  title: Ask Sage User User Management API
  description: Ask Sage User API for account management, organization administration, billing, and platform configuration.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/user'
  description: Ask Sage User API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: User Management
  description: User profile and settings management
paths:
  /register:
    post:
      summary: Register new user
      tags:
      - User Management
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - first_name
              - last_name
              - company
              - email
              - password
              - country
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                company:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                country:
                  type: string
                phone:
                  type: string
                signup_code:
                  type: string
                  description: Optional signup/invitation code
      responses:
        '200':
          description: Registration successful or error message
      operationId: postRegister
      x-operation-id-source: derived
  /update:
    post:
      summary: Update user profile
      tags:
      - User Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - first_name
              - last_name
              - company
              - password
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                company:
                  type: string
                password:
                  type: string
                  description: New password (empty string to keep current)
                phone:
                  type: string
                custom_intro_prompt:
                  type: string
                  description: Custom intro prompt (paid users only)
      responses:
        '200':
          description: Profile updated
      operationId: postUpdate
      x-operation-id-source: derived
  /verify-email:
    post:
      summary: Verify email address
      tags:
      - User Management
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  description: Email verification token
      responses:
        '200':
          description: Email verified
      operationId: postVerifyEmail
      x-operation-id-source: derived
  /lost-pass:
    post:
      summary: Request password reset
      tags:
      - User Management
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset email sent
      operationId: postLostPass
      x-operation-id-source: derived
  /update-mfa:
    post:
      summary: Enable or update MFA
      tags:
      - User Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - totp
              properties:
                totp:
                  type: string
                  description: TOTP code to verify MFA setup
      responses:
        '200':
          description: MFA updated
      operationId: postUpdateMfa
      x-operation-id-source: derived
  /logout:
    post:
      summary: Logout user
      tags:
      - User Management
      responses:
        '200':
          description: User logged out
      operationId: postLogout
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling `/get-token-with-api-key` with your email and 64-character API key. Some admin and superadmin endpoints also require an email address in the request body to identify the target user.
