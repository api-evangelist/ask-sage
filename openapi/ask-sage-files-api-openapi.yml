openapi: 3.2.0
info:
  title: Ask Sage Server Files API
  description: Ask Sage is an AI-powered platform providing intelligent completions, knowledge management, and workflow automation.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/server'
  description: Ask Sage Server API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: Files
  description: File processing and analysis
paths:
  /file:
    post:
      summary: Process and analyze file
      description: Upload a file for processing and text extraction
      tags:
      - Files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File to process
                strategy:
                  type: string
                  enum:
                  - auto
                  - fast
                  - hi_res
                  default: auto
                  description: Processing strategy
                special_csv:
                  type: boolean
                  default: false
                  description: Special CSV processing mode
      responses:
        '200':
          description: File processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                  ret:
                    type: object
                    description: Extracted content
                  sent_filename:
                    type: string
                  status:
                    type: integer
      operationId: postFile
      x-operation-id-source: derived
  /get-video-item:
    post:
      summary: Get video item
      description: Securely retrieve generated video content. The user must own the requested video.
      tags:
      - Files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: integer
                  description: Video ID
      responses:
        '200':
          description: Video content
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '404':
          description: Video not found or access denied
      operationId: postGetVideoItem
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling the User API endpoint `/user/get-token-with-api-key` with your email and API key.
