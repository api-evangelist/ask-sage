openapi: 3.2.0
info:
  title: Ask Sage Server Configuration API
  description: Ask Sage is an AI-powered platform providing intelligent completions, knowledge management, and workflow automation.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/server'
  description: Ask Sage Server API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: Configuration
  description: System configuration endpoints
paths:
  /get-personas:
    get:
      summary: Get available personas
      description: Returns a list of available AI personas
      tags:
      - Configuration
      responses:
        '200':
          description: List of personas
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: array
                    items:
                      type: object
                  status:
                    type: integer
      operationId: getGetPersonas
      x-operation-id-source: derived
    post:
      summary: Get available personas
      description: Returns a list of available AI personas
      tags:
      - Configuration
      responses:
        '200':
          description: List of personas
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: array
                    items:
                      type: object
                  status:
                    type: integer
      operationId: postGetPersonas
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling the User API endpoint `/user/get-token-with-api-key` with your email and API key.
