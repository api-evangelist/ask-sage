openapi: 3.2.0
info:
  title: Ask Sage User Token Requests API
  description: Ask Sage User API for account management, organization administration, billing, and platform configuration.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/user'
  description: Ask Sage User API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: Token Requests
  description: Token request and approval workflow
paths:
  /request-tokens:
    post:
      summary: Request more tokens
      description: Submit a request for additional tokens. May be auto-approved if an auto-approval rule is configured.
      tags:
      - Token Requests
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                requested_amount:
                  type: integer
                  minimum: 1
                  description: Number of tokens requested
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Token request submitted or auto-approved
      operationId: postRequestTokens
      x-operation-id-source: derived
  /get-my-token-requests:
    post:
      summary: Get my token requests
      description: Get the current user's token request history
      tags:
      - Token Requests
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                limit:
                  type: integer
                  default: 10
                  maximum: 100
      responses:
        '200':
          description: Token requests retrieved
      operationId: postGetMyTokenRequests
      x-operation-id-source: derived
  /admin-auto-approval-rule-get:
    post:
      summary: Get auto-approval rule (admin)
      tags:
      - Token Requests
      responses:
        '200':
          description: Rule retrieved
      operationId: postAdminAutoApprovalRuleGet
      x-operation-id-source: derived
  /admin-auto-approval-rule-update:
    post:
      summary: Update auto-approval rule (admin)
      tags:
      - Token Requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                max_approve_amount:
                  type: integer
                max_org_consumption_pct:
                  type: number
      responses:
        '200':
          description: Rule updated
      operationId: postAdminAutoApprovalRuleUpdate
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling `/get-token-with-api-key` with your email and 64-character API key. Some admin and superadmin endpoints also require an email address in the request body to identify the target user.
