openapi: 3.2.0
info:
  title: Ask Sage User Admin API
  description: Ask Sage User API for account management, organization administration, billing, and platform configuration.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/user'
  description: Ask Sage User API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: Admin
  description: Admin operations for organization management
paths:
  /admin-total-purchased-tokens-organization:
    post:
      summary: Get total purchased tokens for organization
      tags:
      - Admin
      responses:
        '200':
          description: Token information retrieved
      operationId: postAdminTotalPurchasedTokensOrganization
      x-operation-id-source: derived
  /admin-used-tokens-for-organization:
    post:
      summary: Get used tokens for organization
      tags:
      - Admin
      responses:
        '200':
          description: Used tokens retrieved
      operationId: postAdminUsedTokensForOrganization
      x-operation-id-source: derived
  /admin-get-dataset:
    post:
      summary: Get datasets for user (admin)
      tags:
      - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Datasets retrieved
      operationId: postAdminGetDataset
      x-operation-id-source: derived
  /admin-export-users-csv:
    post:
      summary: Export organization users to CSV
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full:
                  type: boolean
                  default: false
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
      operationId: postAdminExportUsersCsv
      x-operation-id-source: derived
  /admin-update-user-verified:
    post:
      summary: Verify user email (admin)
      tags:
      - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: integer
      responses:
        '200':
          description: User verified
      operationId: postAdminUpdateUserVerified
      x-operation-id-source: derived
  /admin-update-user-paid:
    post:
      summary: Update user paid status (admin)
      tags:
      - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: integer
                paid:
                  type: integer
                  enum:
                  - 0
                  - 1
      responses:
        '200':
          description: Paid status updated
      operationId: postAdminUpdateUserPaid
      x-operation-id-source: derived
  /admin-update-user-banned:
    post:
      summary: Ban/unban user (admin)
      tags:
      - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: integer
                banned:
                  type: integer
                  enum:
                  - 0
                  - 1
      responses:
        '200':
          description: Ban status updated
      operationId: postAdminUpdateUserBanned
      x-operation-id-source: derived
  /admin-update-user-tokens:
    post:
      summary: Update user token limit (admin)
      tags:
      - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: integer
                tokens:
                  type: integer
      responses:
        '200':
          description: Tokens updated
      operationId: postAdminUpdateUserTokens
      x-operation-id-source: derived
  /admin-update-user-train-tokens:
    post:
      summary: Update user training token limit (admin)
      tags:
      - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: integer
                tokens:
                  type: integer
      responses:
        '200':
          description: Training tokens updated
      operationId: postAdminUpdateUserTrainTokens
      x-operation-id-source: derived
  /admin-get-token-stats:
    post:
      summary: Get token usage statistics (admin)
      tags:
      - Admin
      responses:
        '200':
          description: Statistics retrieved
      operationId: postAdminGetTokenStats
      x-operation-id-source: derived
  /admin-get-user-count:
    post:
      summary: Get user count for organization (admin)
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                paid:
                  type: boolean
                hide_banned:
                  type: boolean
      responses:
        '200':
          description: User count retrieved
      operationId: postAdminGetUserCount
      x-operation-id-source: derived
  /admin-get-all-users-with-tokens:
    post:
      summary: Get all organization users with token info (admin)
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full:
                  type: boolean
                start:
                  type: integer
                limit:
                  type: integer
                  default: 500
                email:
                  type: string
                sort_by:
                  type: string
                  enum:
                  - id
                  - organization_id
                  - type
                  - first_name
                  - last_name
                  - phone
                  - email
                  - company
                  - paid
                  - max_tokens
                  - max_train_tokens
                  - banned
                  - email_verified
                  - country
                  - mfa_secret
                  - x509_cn
                sort_direction:
                  type: string
                  enum:
                  - asc
                  - desc
      responses:
        '200':
          description: Users retrieved
      operationId: postAdminGetAllUsersWithTokens
      x-operation-id-source: derived
  /admin-get-all-logs:
    post:
      summary: Get user logs (admin)
      tags:
      - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              properties:
                user_id:
                  type: integer
      responses:
        '200':
          description: Logs retrieved
      operationId: postAdminGetAllLogs
      x-operation-id-source: derived
  /admin-get-token-requests:
    post:
      summary: Get token requests (admin)
      description: Get token requests for the admin's organization
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  default: pending
                limit:
                  type: integer
                  default: 50
                  maximum: 100
                offset:
                  type: integer
                  default: 0
      responses:
        '200':
          description: Token requests retrieved
      operationId: postAdminGetTokenRequests
      x-operation-id-source: derived
  /admin-review-token-request:
    post:
      summary: Review token request (admin)
      description: Approve or deny a pending token request
      tags:
      - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              - action
              properties:
                request_id:
                  type: integer
                action:
                  type: string
                  enum:
                  - approve
                  - deny
                approved_amount:
                  type: integer
                admin_note:
                  type: string
      responses:
        '200':
          description: Token request reviewed
      operationId: postAdminReviewTokenRequest
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling `/get-token-with-api-key` with your email and 64-character API key. Some admin and superadmin endpoints also require an email address in the request body to identify the target user.
