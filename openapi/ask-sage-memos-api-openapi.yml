openapi: 3.2.0
info:
  title: Ask Sage User Memos API
  description: Ask Sage User API for account management, organization administration, billing, and platform configuration.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/user'
  description: Ask Sage User API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: Memos
  description: Memo management within workbooks
paths:
  /memo:
    put:
      summary: Add memo to workbook
      tags:
      - Memos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workbook_id
              - type
              - title
              properties:
                workbook_id:
                  type: integer
                type:
                  type: string
                title:
                  type: string
                content:
                  type: string
                  default: ''
                references:
                  type: string
                  default: ''
                references_descriptions:
                  type: string
                  default: ''
      responses:
        '200':
          description: Memo added
      operationId: putMemo
      x-operation-id-source: derived
    delete:
      summary: Delete memo
      tags:
      - Memos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - memo_id
              properties:
                memo_id:
                  type: integer
      responses:
        '200':
          description: Memo deleted
      operationId: deleteMemo
      x-operation-id-source: derived
  /get-memos:
    post:
      summary: Get memos for workbook
      tags:
      - Memos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workbook_id
              properties:
                workbook_id:
                  type: integer
      responses:
        '200':
          description: Memos retrieved
      operationId: postGetMemos
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling `/get-token-with-api-key` with your email and 64-character API key. Some admin and superadmin endpoints also require an email address in the request body to identify the target user.
