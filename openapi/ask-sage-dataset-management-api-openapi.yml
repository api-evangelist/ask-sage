openapi: 3.2.0
info:
  title: Ask Sage User Dataset Management API
  description: Ask Sage User API for account management, organization administration, billing, and platform configuration.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/user'
  description: Ask Sage User API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: Dataset Management
  description: Dataset operations and permissions
paths:
  /add-dataset:
    post:
      summary: Add dataset to user
      tags:
      - Dataset Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - dataset
              properties:
                dataset:
                  type: string
                  minLength: 4
                  maxLength: 100
                classification:
                  type: string
                  enum:
                  - Unclassified
                  - CUI
                is_tabular:
                  type: boolean
                  default: false
                  description: Whether this is a tabular dataset
      responses:
        '200':
          description: Dataset added
      operationId: postAddDataset
      x-operation-id-source: derived
  /assign-dataset:
    post:
      summary: Assign dataset to user
      tags:
      - Dataset Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - dataset
              - email
              properties:
                dataset:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Dataset assigned
      operationId: postAssignDataset
      x-operation-id-source: derived
  /deassign-dataset:
    post:
      summary: Remove dataset from user
      tags:
      - Dataset Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - dataset
              - email
              properties:
                dataset:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Dataset deassigned
      operationId: postDeassignDataset
      x-operation-id-source: derived
  /update-permission-dataset:
    post:
      summary: Update dataset permissions
      tags:
      - Dataset Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - dataset
              - email
              properties:
                dataset:
                  type: string
                email:
                  type: string
                  format: email
                permissions:
                  type: string
                  enum:
                  - read
                  - edit
                  - admin
                  default: read
      responses:
        '200':
          description: Permissions updated
      operationId: postUpdatePermissionDataset
      x-operation-id-source: derived
  /get-datasets-with-permissions:
    post:
      summary: Get user datasets with permissions
      tags:
      - Dataset Management
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                check_permissions:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Datasets retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dataset'
      operationId: postGetDatasetsWithPermissions
      x-operation-id-source: derived
    get:
      summary: Get user datasets with permissions (GET)
      tags:
      - Dataset Management
      responses:
        '200':
          description: Datasets retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dataset'
      operationId: getGetDatasetsWithPermissions
      x-operation-id-source: derived
  /delete-dataset:
    post:
      summary: Delete dataset
      tags:
      - Dataset Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - dataset
              properties:
                dataset:
                  type: string
      responses:
        '200':
          description: Dataset deleted
      operationId: postDeleteDataset
      x-operation-id-source: derived
  /get-dataset-permissions:
    post:
      summary: Check dataset permissions
      tags:
      - Dataset Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - dataset
              properties:
                dataset:
                  type: string
                permissions:
                  type: string
                  enum:
                  - read
                  - edit
                  - admin
                  default: read
      responses:
        '200':
          description: Permission check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: boolean
                  status:
                    type: integer
      operationId: postGetDatasetPermissions
      x-operation-id-source: derived
  /get-dataset-assignments:
    post:
      summary: Get dataset assignments
      tags:
      - Dataset Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - dataset
              properties:
                dataset:
                  type: string
      responses:
        '200':
          description: Assignments retrieved
      operationId: postGetDatasetAssignments
      x-operation-id-source: derived
  /update-dataset-organization:
    post:
      summary: Update dataset organization sharing
      tags:
      - Dataset Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - dataset
              properties:
                dataset:
                  type: string
                enable:
                  type: boolean
                  description: Enable or disable organization-wide access
      responses:
        '200':
          description: Organization sharing updated
      operationId: postUpdateDatasetOrganization
      x-operation-id-source: derived
  /get-dataset-organization:
    post:
      summary: Get dataset organization status
      tags:
      - Dataset Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - dataset
              properties:
                dataset:
                  type: string
      responses:
        '200':
          description: Organization status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: integer
                    enum:
                    - 0
                    - 1
                  status:
                    type: integer
      operationId: postGetDatasetOrganization
      x-operation-id-source: derived
components:
  schemas:
    Dataset:
      type: object
      properties:
        dataset:
          type: string
        classification:
          type: string
          enum:
          - Unclassified
          - CUI
        permissions:
          type: string
          enum:
          - read
          - edit
          - admin
          - owner
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling `/get-token-with-api-key` with your email and 64-character API key. Some admin and superadmin endpoints also require an email address in the request body to identify the target user.
