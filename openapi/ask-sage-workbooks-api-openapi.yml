openapi: 3.2.0
info:
  title: Ask Sage User Workbooks API
  description: Ask Sage User API for account management, organization administration, billing, and platform configuration.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/user'
  description: Ask Sage User API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: Workbooks
  description: Workbook management
paths:
  /workbook:
    put:
      summary: Create workbook
      tags:
      - Workbooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              properties:
                title:
                  type: string
                classification:
                  type:
                  - string
                  - 'null'
      responses:
        '200':
          description: Workbook created
      operationId: putWorkbook
      x-operation-id-source: derived
    delete:
      summary: Delete workbook
      tags:
      - Workbooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workbook_id
              properties:
                workbook_id:
                  type: integer
      responses:
        '200':
          description: Workbook deleted
      operationId: deleteWorkbook
      x-operation-id-source: derived
  /workbook-chats:
    post:
      summary: Update workbook chats
      tags:
      - Workbooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workbook_id
              - chats
              properties:
                workbook_id:
                  type: integer
                chats:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Workbook chats updated
      operationId: postWorkbookChats
      x-operation-id-source: derived
  /workbook-summary:
    post:
      summary: Update workbook summary
      tags:
      - Workbooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workbook_id
              - overall_summary
              properties:
                workbook_id:
                  type: integer
                overall_summary:
                  type: string
      responses:
        '200':
          description: Workbook summary updated
      operationId: postWorkbookSummary
      x-operation-id-source: derived
  /get-workbooks:
    post:
      summary: Get workbooks
      tags:
      - Workbooks
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Workbooks retrieved
      operationId: postGetWorkbooks
      x-operation-id-source: derived
  /assign-workbook:
    post:
      summary: Assign workbook to user
      tags:
      - Workbooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workbook_id
              - email
              properties:
                workbook_id:
                  type: integer
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Workbook assigned
      operationId: postAssignWorkbook
      x-operation-id-source: derived
  /deassign-workbook:
    post:
      summary: Remove workbook assignment
      tags:
      - Workbooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workbook_id
              - email
              properties:
                workbook_id:
                  type: integer
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Workbook deassigned
      operationId: postDeassignWorkbook
      x-operation-id-source: derived
  /get-workbook-assignments:
    post:
      summary: Get workbook assignments
      tags:
      - Workbooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workbook_id
              properties:
                workbook_id:
                  type: integer
      responses:
        '200':
          description: Assignments retrieved
      operationId: postGetWorkbookAssignments
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling `/get-token-with-api-key` with your email and 64-character API key. Some admin and superadmin endpoints also require an email address in the request body to identify the target user.
