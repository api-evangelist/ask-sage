openapi: 3.2.0
info:
  title: Ask Sage User Sources API
  description: Ask Sage User API for account management, organization administration, billing, and platform configuration.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/user'
  description: Ask Sage User API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: Sources
  description: Source management within workbooks
paths:
  /source:
    put:
      summary: Add source to workbook
      tags:
      - Sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workbook_id
              - source_type
              - identifier
              properties:
                workbook_id:
                  type: integer
                source_type:
                  type: string
                identifier:
                  type: string
                summary:
                  type: string
                  default: ''
                tags:
                  type: string
                  default: ''
                full_text:
                  type: string
                  default: ''
      responses:
        '200':
          description: Source added
      operationId: putSource
      x-operation-id-source: derived
    delete:
      summary: Delete source
      tags:
      - Sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source_id
              properties:
                source_id:
                  type: integer
      responses:
        '200':
          description: Source deleted
      operationId: deleteSource
      x-operation-id-source: derived
  /get-sources:
    post:
      summary: Get sources for workbook
      tags:
      - Sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workbook_id
              properties:
                workbook_id:
                  type: integer
      responses:
        '200':
          description: Sources retrieved
      operationId: postGetSources
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling `/get-token-with-api-key` with your email and 64-character API key. Some admin and superadmin endpoints also require an email address in the request body to identify the target user.
