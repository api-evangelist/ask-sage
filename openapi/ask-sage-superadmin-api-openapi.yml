components:
  schemas:
    Organization:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        point_contact:
          type: string
        address:
          type: string
        zip:
          type: string
        city:
          type: string
        country:
          type: string
        phone:
          type: string
        email:
          type: string
        domainname:
          type: string
        force_models:
          type: string
        settings:
          type: string
    OrganizationPurchase:
      type: object
      properties:
        id:
          type: integer
        organization_id:
          type: integer
        date_purchase:
          type: string
          format: date-time
        email_payer:
          type: string
        payer_comment:
          type: string
        total_tokens:
          type: integer
          format: int64
        total_training_tokens:
          type: integer
          format: int64
        expiration:
          type: string
          format: date-time
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling `/get-token-with-api-key` with your email and 64-character API key. Some admin and superadmin endpoints also require an email address in the request body to identify the target user.
