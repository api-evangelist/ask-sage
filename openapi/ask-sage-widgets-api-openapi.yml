openapi: 3.2.0
info:
  title: Ask Sage User Widgets API
  description: Ask Sage User API for account management, organization administration, billing, and platform configuration.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/user'
  description: Ask Sage User API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: Widgets
  description: Widget/bot management
paths:
  /add-widget:
    post:
      summary: Add widget
      tags:
      - Widgets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                model:
                  type: string
                persona:
                  type: string
                whitelisted_domains:
                  type: array
                  items:
                    type: string
                datasets:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Widget added
      operationId: postAddWidget
      x-operation-id-source: derived
  /update-widget:
    put:
      summary: Update widget
      tags:
      - Widgets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - widget_id
              properties:
                widget_id:
                  type: integer
                name:
                  type: string
                model:
                  type: string
                persona:
                  type: string
                whitelisted_domains:
                  type: array
                  items:
                    type: string
                datasets:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Widget updated
      operationId: putUpdateWidget
      x-operation-id-source: derived
  /list-widgets:
    get:
      summary: List widgets
      tags:
      - Widgets
      responses:
        '200':
          description: Widgets listed
      operationId: getListWidgets
      x-operation-id-source: derived
    post:
      summary: List widgets (POST)
      tags:
      - Widgets
      responses:
        '200':
          description: Widgets listed
      operationId: postListWidgets
      x-operation-id-source: derived
  /delete-widget:
    delete:
      summary: Delete widget
      tags:
      - Widgets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - widget_id
              properties:
                widget_id:
                  type: integer
      responses:
        '200':
          description: Widget deleted
      operationId: deleteDeleteWidget
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling `/get-token-with-api-key` with your email and 64-character API key. Some admin and superadmin endpoints also require an email address in the request body to identify the target user.
