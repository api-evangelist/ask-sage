openapi: 3.2.0
info:
  title: Ask Sage Server Feedback API
  description: Ask Sage is an AI-powered platform providing intelligent completions, knowledge management, and workflow automation.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/server'
  description: Ask Sage Server API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: Feedback
  description: User feedback operations
paths:
  /vote-down:
    post:
      summary: Vote down a response
      description: Mark a response as unhelpful or incorrect
      tags:
      - Feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - uuid
              properties:
                uuid:
                  type: string
                  description: UUID of the response to vote down
      responses:
        '200':
          description: Vote recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                  status:
                    type: integer
      operationId: postVoteDown
      x-operation-id-source: derived
    get:
      summary: Vote down a response (GET)
      description: Mark a response as unhelpful or incorrect
      tags:
      - Feedback
      responses:
        '200':
          description: Vote recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                  status:
                    type: integer
      operationId: getVoteDown
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling the User API endpoint `/user/get-token-with-api-key` with your email and API key.
