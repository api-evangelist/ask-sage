openapi: 3.2.0
info:
  title: Ask Sage Server Deep Agent API
  description: Ask Sage is an AI-powered platform providing intelligent completions, knowledge management, and workflow automation.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/server'
  description: Ask Sage Server API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: Deep Agent
  description: Deep agent operations
paths:
  /get-deep-agent:
    post:
      summary: Get deep agent updates
      description: Get streaming updates from a deep agent
      tags:
      - Deep Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - deep_agent_id
              properties:
                deep_agent_id:
                  type: integer
                  description: ID of the deep agent
      responses:
        '200':
          description: Deep agent updates (streaming)
          content:
            text/plain:
              schema:
                type: string
      operationId: postGetDeepAgent
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling the User API endpoint `/user/get-token-with-api-key` with your email and API key.
