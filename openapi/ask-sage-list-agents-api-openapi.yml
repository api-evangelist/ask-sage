openapi: 3.2.0
info:
  title: Ask Sage Server List Agents API
  description: Ask Sage is an AI-powered platform providing intelligent completions, knowledge management, and workflow automation.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/server'
  description: Ask Sage Server API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: List Agents
paths:
  /list-agents:
    get:
      summary: List Agents
      description: Returns a list of all agents available to the authenticated user.
      operationId: list_agents_ep
      responses:
        '200':
          description: A list of available agents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        uuid:
                          type: string
                          format: uuid
                        name:
                          type: string
                        description:
                          type: string
                        agent_mode:
                          type: string
                          enum:
                          - single
                          - router
                          - autonomous
                        primary_workflow_uuid:
                          type: string
                          format: uuid
                        current_version:
                          type: integer
                        is_published:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                  count:
                    type: integer
                    description: The total number of agents returned.
                    example: 1
                  status:
                    type: integer
                    description: The HTTP status code.
                    example: 200
        '401':
          description: Authentication failed.
        '500':
          description: Internal Server Error.
      tags:
      - List Agents
    post:
      summary: List Agents (POST)
      description: Returns a list of all agents available to the authenticated user.
      operationId: list_agents_ep
      responses:
        '200':
          description: A list of available agents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        uuid:
                          type: string
                          format: uuid
                        name:
                          type: string
                        description:
                          type: string
                        agent_mode:
                          type: string
                          enum:
                          - single
                          - router
                          - autonomous
                        primary_workflow_uuid:
                          type: string
                          format: uuid
                        current_version:
                          type: integer
                        is_published:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                  count:
                    type: integer
                    description: The total number of agents returned.
                    example: 1
                  status:
                    type: integer
                    description: The HTTP status code.
                    example: 200
        '401':
          description: Authentication failed.
        '500':
          description: Internal Server Error.
      tags:
      - List Agents
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling the User API endpoint `/user/get-token-with-api-key` with your email and API key.
