openapi: 3.2.0
info:
  title: Ask Sage User API Key Management API
  description: Ask Sage User API for account management, organization administration, billing, and platform configuration.
  version: '2.0'
  contact:
    name: Ask Sage Support
    email: support@asksage.ai
    url: https://asksage.ai
servers:
- url: '{baseUrl}/user'
  description: Ask Sage User API
  variables:
    baseUrl:
      default: https://api.asksage.ai
      description: API base URL. Use https://api.asksage.ai for production, or your self-hosted instance URL.
security:
- ApiKeyAuth: []
tags:
- name: API Key Management
  description: API key operations
paths:
  /get-user-api-keys:
    post:
      summary: Get user API keys
      tags:
      - API Key Management
      responses:
        '200':
          description: API keys retrieved
      operationId: postGetUserApiKeys
      x-operation-id-source: derived
  /user-api-key:
    post:
      summary: Create new API key
      tags:
      - API Key Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: API key created
      operationId: postUserApiKey
      x-operation-id-source: derived
    delete:
      summary: Delete API key
      tags:
      - API Key Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: integer
      responses:
        '200':
          description: API key deleted
      operationId: deleteUserApiKey
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-access-tokens
      description: JWT authentication token. Obtain a token by calling `/get-token-with-api-key` with your email and 64-character API key. Some admin and superadmin endpoints also require an email address in the request body to identify the target user.
